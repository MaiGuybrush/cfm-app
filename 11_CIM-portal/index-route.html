<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CIM 產線流程入口</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* 方案 A「產線流程」：入口本身就是一張架構圖。MFG→ENG→INT→QA 是產線，AI 橫跨其上，CIM 墊在底下。
       黃色底取自黃光室，只用在這張圖。 */
    :root {
      --page: #f5f6f8;
      --yr: #fbe98f;       /* 黃光室 */
      --yr-soft: #fff6c9;
      --ink: #0e1f44;
      --mute: #56607a;
      --rule: #d5dae4;
      --array: #2b66f0; --cf: #12a06a; --lcd: #e89a00; --plp: #9b46d1;
      --font: 'Schibsted Grotesk', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--page); color: var(--ink); font: 400 15px/1.6 var(--font); }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    button { font: inherit; color: inherit; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px); }

    .top { background: var(--yr); }
    .top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-top: 18px; }
    .brand { font: 900 22px/1 var(--font); }
    .brand span { margin-left: 8px; padding: 1px 7px; border: 2px solid var(--ink); font-size: 12px; font-weight: 700; vertical-align: 3px; }
    .q { flex: 0 1 380px; }
    .q input { width: 100%; height: 42px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 0; background: #fff; font: 400 15px var(--font); color: var(--ink); }
    .q input:focus { outline-offset: 2px; }

    /* 流程圖 */
    .map { background: var(--yr); padding: 26px 0 36px; }
    .map .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 20px 44px; align-items: center; }
    .stack { display: grid; gap: 22px; }
    .band { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; border: 2px solid var(--ink); border-radius: 0; background: transparent; text-align: left; cursor: pointer; font: 700 17px var(--font); }
    .band small, .stn small, .pick small { font: 500 13px var(--font); opacity: .8; }
    .band:hover, .pick:hover { background: var(--yr-soft); }
    .track { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); padding-top: 4px; }
    .track::before { content: ''; position: absolute; left: 12.5%; right: 12.5%; top: 16px; height: 4px; background: var(--ink); }
    .car { position: absolute; top: 12px; left: 12.5%; width: 12px; height: 12px; background: var(--yr); border: 2px solid var(--ink); opacity: 0; z-index: 2; }
    .stn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 4px 4px; border: 0; background: none; cursor: pointer; font: 700 17px/1.3 var(--font); text-align: center; }
    .node { width: 26px; height: 26px; border: 4px solid var(--ink); border-radius: 50%; background: var(--yr); z-index: 1; }
    .stn:hover .node { background: #fff; }
    .stn[aria-current="true"] .node { background: var(--ink); box-shadow: 0 0 0 4px var(--yr), 0 0 0 7px var(--ink); }
    .stn[aria-current="true"] { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; }
    .band[aria-current="true"], .pick[aria-current="true"] { background: var(--ink); color: var(--yr); }
    .side { display: grid; gap: 10px; }
    .pick { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 0; background: transparent; cursor: pointer; font: 700 15px var(--font); }

    /* 內容 */
    .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; padding-top: 36px; }
    .head h1 { font: 900 clamp(30px, 4vw, 46px)/1.1 var(--font); }
    .head p { margin-top: 6px; color: var(--mute); max-width: 56ch; }
    .views { display: inline-flex; margin-top: 14px; border: 2px solid var(--ink); }
    .views button { padding: 5px 16px; border: 0; border-radius: 0; background: none; font-weight: 700; cursor: pointer; }
    .views button[aria-pressed="true"] { background: var(--ink); color: var(--yr); }
    .fabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .fabs button { display: flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 0; background: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
    .fabs button::before { content: ''; width: 9px; height: 9px; background: var(--c, var(--mute)); }
    .fabs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

    .g { margin-top: 36px; }
    .g h2 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 14px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); font: 700 19px/1.4 var(--font); }
    .g h2 small { font-weight: 400; font-size: 13px; color: var(--mute); }
    .g h2 span { margin-left: auto; font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 12px; margin-top: 16px; }
    .tile { position: relative; display: grid; grid-template-columns: 1fr auto; align-content: start; gap: 12px 8px; min-height: 152px; padding: 14px; border: 1px solid #b4bccc; border-radius: 4px; background: #fff; }
    .tile:hover, .tile:focus-within { background: var(--yr-soft); border-color: var(--ink); }
    .ico { position: relative; display: grid; place-items: center; width: 44px; height: 44px; overflow: hidden; border-radius: 4px; background: var(--ink); color: var(--yr); }
    .ico b { font: 900 20px var(--font); }
    .ico img { position: absolute; inset: 0; width: 100%; height: 100%; padding: 5px; object-fit: contain; background: #fff; }
    .tx { grid-column: 1 / -1; align-self: start; }
    .tx a { font: 700 16px/1.3 var(--font); color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
    .tx a::after { content: ''; position: absolute; inset: 0; }   /* 整張磚都是連結 */
    .tx span { display: block; margin-top: 2px; font-size: 12.5px; line-height: 1.45; color: var(--mute); }
    .star { position: relative; z-index: 1; display: grid; place-items: center; width: 34px; height: 34px; border: 0; background: none; color: #8a93a8; cursor: pointer; }
    .star:hover { color: var(--ink); }
    .star[aria-pressed="true"] { color: var(--ink); }
    .ft { grid-column: 1 / -1; align-self: end; display: flex; align-items: center; justify-content: space-between; }
    .pips { display: flex; gap: 4px; }
    .pips i { width: 9px; height: 9px; background: var(--c); }
    .pips i.off { background: none; box-shadow: inset 0 0 0 1px #b4bccc; }
    .doc { position: relative; z-index: 1; font-size: 12.5px; color: var(--ink); text-underline-offset: 3px; }
    .empty { margin-top: 36px; padding-top: 14px; border-top: 2px solid var(--ink); color: var(--mute); max-width: 44ch; }

    .peek { position: sticky; bottom: 0; margin-top: 56px; background: var(--ink); color: #fff; }
    .peek .wrap { display: flex; align-items: baseline; gap: 6px 16px; padding-top: 12px; padding-bottom: 12px; min-height: 52px; font-size: 14px; }
    .peek b { flex: none; color: var(--yr); }

    @media (prefers-reduced-motion: no-preference) {
      .car { animation: run 2.2s .4s ease-in-out 1 both; }
      @keyframes run { 0% { left: 12.5%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { left: calc(87.5% - 12px); opacity: 0; } }
    }

    @media (max-width: 820px) {
      .map .wrap { grid-template-columns: 1fr; }
      .side { grid-template-columns: 1fr 1fr; }
      .track { grid-template-columns: 1fr 1fr; gap: 14px 0; }
      .track::before, .car { display: none; }
      .peek .wrap { display: block; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">CIM Portal<span>2.0</span></div>
      <div class="q">
        <label class="sr" for="q">搜尋系統</label>
        <input id="q" type="search" placeholder="搜尋系統名稱、縮寫或關鍵字（按 / 跳到這裡）" autocomplete="off">
      </div>
    </div>
  </header>

  <section class="map" aria-label="角色">
    <div class="wrap">
      <div class="stack" id="stack"></div>
      <div class="side" id="side"></div>
    </div>
  </section>

  <main class="wrap" id="main"></main>

  <footer class="peek"><div class="wrap" id="peek"></div></footer>

  <script src="portal-data.js"></script>
  <script src="portal-core.js"></script>
  <script>
    (() => {
      const K = CimCore, { C, esc } = K, $ = id => document.getElementById(id);
      const FABS = ['ARRAY', 'CF', 'LCD', 'PLP'];
      const HINT = '游標移到系統上，這裡會顯示完整說明。';
      const byId = id => C.roles.find(r => r.id === id);
      const pickBtn = (cls, r, st, name) => `<button class="${cls}" data-role="${r.id}" data-k="r-${r.id}" aria-current="${st.role === r.id}"><span>${esc(name || r.name)}</span><small>${K.count(r.id)}</small></button>`;

      let first = true;   // 小車只在載入時跑一次
      K.bindSearch($('q'));
      $('peek').innerHTML = HINT;

      document.addEventListener('click', e => {
        const r = e.target.closest('[data-role]'); if (r) return K.set({ role: r.dataset.role });
        const f = e.target.closest('[data-fab]'); if (f) return K.set({ fab: f.dataset.fab });
        const s = e.target.closest('[data-star]'); if (s) return K.toggleFav(s.dataset.star);
        const v = e.target.closest('[data-view]'); if (v) K.set({ aiView: v.dataset.view });
      });

      // 游標或鍵盤移到磚上，底部顯示完整說明
      const peek = e => {
        const t = e.target.closest && e.target.closest('.tile');
        $('peek').innerHTML = t ? `<b>${esc(t.dataset.name)}</b><span>${esc(t.dataset.desc)}</span>` : HINT;
      };
      $('main').addEventListener('mouseover', peek);
      $('main').addEventListener('focusin', peek);
      $('main').addEventListener('mouseleave', () => { $('peek').innerHTML = HINT; });

      const tile = (s, st) => {
        const doc = s.docs[0];
        return `<article class="tile" data-name="${esc(s.name)}" data-desc="${esc(s.desc)}">
          ${K.icon(s)}${K.starBtn(s)}
          <div class="tx"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a><span>${esc(s.title)}</span></div>
          <div class="ft"><span class="pips" role="img" aria-label="適用廠別：${s.fabs.map(K.fabName).join('、')}">${FABS.map(f => `<i class="${K.has(s, f) ? '' : 'off'}" style="--c:var(--${f.toLowerCase()})"></i>`).join('')}</span>${doc ? `<a class="doc" href="${esc(doc.url)}" target="_blank" rel="noopener">手冊</a>` : ''}</div>
        </article>`;
      };

      K.mount(st => {
        $('stack').innerHTML = pickBtn('band', byId('ai'), st, 'AI 智造旗艦')
          + `<div class="track">${first ? '<i class="car"></i>' : ''}${['mfg', 'eng', 'int', 'qa'].map(id => {
              const r = byId(id);
              return `<button class="stn" data-role="${id}" data-k="r-${id}" aria-current="${st.role === id}"><span class="node"></span><span>${esc(r.name)}</span><small>${K.count(id)} 個系統</small></button>`;
            }).join('')}</div>`
          + pickBtn('band', byId('cim'), st);
        first = false;
        $('side').innerHTML = pickBtn('pick', byId('all'), st) + pickBtn('pick', K.role('fav'), st, '★ 我的常用');

        const r = K.role(st.role), gs = K.groups();
        const views = st.role === 'ai'
          ? `<div class="views">${[['scenario', '應用場景'], ['tech', '技術架構']].map(([id, t]) => `<button data-view="${id}" data-k="v-${id}" aria-pressed="${st.aiView === id}">${t}</button>`).join('')}</div>`
          : '';
        const fabBtns = ['ALL', ...FABS].map(f => `<button data-fab="${f}" data-k="f-${f}" aria-pressed="${st.fab === f}"${f === 'ALL' ? '' : ` style="--c:var(--${f.toLowerCase()})"`}>${f === 'ALL' ? '全部廠別' : f}</button>`).join('');

        $('main').innerHTML = `<div class="head"><div><h1>${esc(r.name)}</h1><p>${esc(r.desc)}</p>${views}</div><div class="fabs" role="group" aria-label="廠別">${fabBtns}</div></div>`
          + (gs.length
            ? gs.map(g => `<section class="g">${g.flat ? '' : `<h2>${esc(g.name)}${g.desc ? `<small>${esc(g.desc)}</small>` : ''}<span>${g.systems.length}</span></h2>`}<div class="tiles">${g.systems.map(s => tile(s, st)).join('')}</div></section>`).join('')
            : `<div class="empty">${K.emptyMsg()}</div>`);
      });
    })();
  </script>
</body>
</html>
