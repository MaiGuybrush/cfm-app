<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CIM 系統名錄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Noto+Sans+TC:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    /* 方案 B「名錄」：以搜尋為首頁、以表格為主體；廠別是欄，不是標籤。 */
    :root {
      --sub: #e4ecee;      /* 玻璃基板灰藍 */
      --paper: #f7fafa;
      --ink: #0f2229;
      --mute: #4f646b;
      --rule: #b9c9cd;
      --sig: #ff5a1f;      /* 只用在焦點與「開啟」 */
      --ai: #5236c9;
      --array: #2b66f0; --cf: #12a06a; --lcd: #e89a00; --plp: #9b46d1;
      --display: 'Archivo', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      --body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--sub); color: var(--ink); font: 400 15px/1.6 var(--body); }
    :focus-visible { outline: 3px solid var(--sig); outline-offset: 2px; }
    button { font: inherit; color: inherit; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    .top, .find, .shell { max-width: 1400px; margin: 0 auto; padding-left: 32px; padding-right: 32px; }
    .top { display: flex; justify-content: space-between; align-items: baseline; padding-top: 20px; }
    .brand { font: 900 20px/1 var(--display); font-stretch: 125%; letter-spacing: .02em; }
    .brand span { font-weight: 300; font-stretch: 75%; margin-left: .5em; }
    #upd { font-size: 13px; color: var(--mute); }

    /* 搜尋 */
    .find { display: flex; align-items: flex-end; gap: 24px; padding-top: 44px; padding-bottom: 32px; }
    .find input {
      flex: 1; min-width: 0; background: transparent; color: var(--ink); border: 0; border-radius: 0;
      border-bottom: 3px solid var(--ink); padding: 0 0 10px; outline: none;
      font: 300 clamp(26px, 4.6vw, 56px)/1.2 var(--body);
    }
    .find input::placeholder { color: #7f9298; }
    .find input:focus { border-bottom-color: var(--sig); }
    #found { font: 400 15px var(--body); color: var(--mute); white-space: nowrap; padding-bottom: 12px; }
    #found b { font: 800 32px/1 var(--display); font-stretch: 110%; color: var(--ink); margin-right: 4px; font-variant-numeric: tabular-nums; }

    /* 版面 */
    .shell { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 40px; align-items: start; padding-bottom: 72px; }
    main { --cols: 44px minmax(210px, 1.15fr) minmax(0, 2fr) repeat(4, 64px) 128px; min-width: 0; }

    .roles { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 2px; }
    .role { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 12px; border: 0; border-radius: 2px; background: none; text-align: left; font-weight: 500; cursor: pointer; }
    .role:hover { background: rgba(15, 34, 41, .07); }
    .role[aria-current="true"] { background: var(--ink); color: var(--paper); }
    .role .n { font: 600 13px var(--display); font-variant-numeric: tabular-nums; opacity: .7; }
    .role.fav { margin-top: 14px; border-top: 1px solid var(--rule); border-radius: 0 0 2px 2px; padding-top: 14px; }

    .head h1 { font: 800 clamp(28px, 3.4vw, 44px)/1.15 var(--body); letter-spacing: -.01em; }
    .head p { margin-top: 6px; color: var(--mute); max-width: 62ch; }
    .views { display: flex; gap: 22px; margin-top: 16px; }
    .views button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 4px 0; color: var(--mute); font-weight: 500; cursor: pointer; }
    .views button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }

    /* 欄位列：廠別是可點的欄名 */
    .cols { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: var(--cols); gap: 0 12px; align-items: end; margin-top: 24px; padding: 10px 0 8px; background: var(--sub); border-bottom: 2px solid var(--ink); font-size: 13px; color: var(--mute); }
    .cols .c-nm { grid-column: 1 / 3; }
    .cols .c-act { text-align: right; }
    .fab { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 5px 0; border: 0; border-radius: 3px; background: none; cursor: pointer; font: 700 12px var(--display); letter-spacing: .04em; color: var(--ink); }
    .fab::before { content: ''; width: 12px; height: 12px; border-radius: 2px; background: var(--c); }
    .fab:hover { background: rgba(15, 34, 41, .08); }
    .fab[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

    .grp { margin-top: 36px; }
    #root .grp:first-child { margin-top: 20px; }
    .grp-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; padding-bottom: 10px; }
    .grp-h h2 { font: 700 20px/1.3 var(--body); }
    .grp-h p { font-size: 13px; color: var(--mute); }
    .grp-h .cnt { margin-left: auto; font: 600 13px var(--display); color: var(--mute); }

    .row { display: grid; grid-template-columns: var(--cols); gap: 0 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--rule); }
    .row:hover { background: var(--paper); }
    .star { display: grid; place-items: center; width: 40px; height: 40px; border: 0; background: none; color: #8ea1a7; cursor: pointer; border-radius: 3px; }
    .star:hover { color: var(--ink); }
    .star[aria-pressed="true"] { color: var(--sig); }
    .nm { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .nm a { font: 700 16px/1.35 var(--body); color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
    .nm a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .nm small { display: block; font-size: 12.5px; color: var(--mute); line-height: 1.4; }
    .ico { position: relative; flex: none; display: grid; place-items: center; width: 34px; height: 34px; overflow: hidden; border-radius: 4px; background: var(--ink); color: var(--paper); }
    .ico b { font: 800 15px var(--display); }
    .ico img { position: absolute; inset: 0; width: 100%; height: 100%; padding: 4px; object-fit: contain; background: var(--paper); }
    .ds { font-size: 13.5px; line-height: 1.55; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ds em { display: block; font-style: normal; font-weight: 700; font-size: 12px; color: var(--ai); margin-top: 2px; }

    .cell { display: grid; place-items: center; align-self: stretch; }
    .cell.sel { background: rgba(15, 34, 41, .06); }
    .cell i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); }
    .cell.off i { width: 10px; height: 2px; border-radius: 0; background: var(--rule); }

    .act { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
    .doc { font-size: 13px; color: var(--ink); text-underline-offset: 3px; }
    .go { padding: 7px 16px; border-radius: 3px; background: var(--sig); color: var(--ink); font-weight: 700; text-decoration: none; }
    .go:hover { background: var(--ink); color: var(--paper); }

    .empty { padding: 56px 0; border-top: 1px solid var(--rule); color: var(--mute); max-width: 44ch; }

    @media (prefers-reduced-motion: no-preference) {
      .row { animation: in .18s ease-out; }
      @keyframes in { from { opacity: 0; } }
    }

    @media (max-width: 1000px) {
      .top, .find, .shell { padding-left: 16px; padding-right: 16px; }
      .shell { grid-template-columns: 1fr; gap: 12px; }
      .roles { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
      .role { white-space: nowrap; gap: 8px; }
      .role.fav { margin: 0; border: 0; padding-top: 10px; }
    }
    @media (max-width: 820px) {
      main { --cols: 40px minmax(0, 1fr) repeat(4, 30px) 64px; }
      .ds, .cols .c-ds { display: none; }
      .act { flex-direction: column; align-items: flex-end; gap: 4px; }
      .find { flex-direction: column; align-items: stretch; gap: 8px; padding-top: 28px; }
      #found { padding-bottom: 0; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">CIM<span>Web Portal 2.0</span></div>
    <span id="upd"></span>
  </header>

  <div class="find">
    <label class="sr" for="q">搜尋系統</label>
    <input id="q" type="search" placeholder="找系統：名稱、縮寫、關鍵字" autocomplete="off" autofocus>
    <output id="found" for="q"></output>
  </div>

  <div class="shell">
    <nav class="roles" id="roles" aria-label="角色"></nav>
    <main>
      <div id="head"></div>
      <div class="cols" id="cols">
        <span class="c-nm">系統</span>
        <span class="c-ds">說明</span>
        <button class="fab" data-fab="ARRAY" style="--c:var(--array)" title="只看 ARRAY 適用的系統">ARRAY</button>
        <button class="fab" data-fab="CF" style="--c:var(--cf)" title="只看 CF 適用的系統">CF</button>
        <button class="fab" data-fab="LCD" style="--c:var(--lcd)" title="只看 LCD 適用的系統">LCD</button>
        <button class="fab" data-fab="PLP" style="--c:var(--plp)" title="只看 PLP 適用的系統">PLP</button>
        <span class="c-act">開啟</span>
      </div>
      <div id="root"></div>
    </main>
  </div>

  <script src="portal-data.js"></script>
  <script src="portal-core.js"></script>
  <script>
    (() => {
      const K = CimCore, { C, esc } = K, $ = id => document.getElementById(id);
      const FABS = ['ARRAY', 'CF', 'LCD', 'PLP'];

      K.bindSearch($('q'));
      $('upd').textContent = '資料更新 ' + C.lastUpdated;

      $('cols').addEventListener('click', e => {
        const b = e.target.closest('[data-fab]');
        if (b) K.set({ fab: K.st.fab === b.dataset.fab ? 'ALL' : b.dataset.fab });
      });
      $('roles').addEventListener('click', e => {
        const b = e.target.closest('[data-role]');
        if (b) K.set({ role: b.dataset.role });
      });
      document.querySelector('main').addEventListener('click', e => {
        const s = e.target.closest('[data-star]'); if (s) K.toggleFav(s.dataset.star);
        const v = e.target.closest('[data-view]'); if (v) K.set({ aiView: v.dataset.view });
      });

      const row = (s, st) => {
        const doc = s.docs[0];
        return `<div class="row">
          ${K.starBtn(s)}
          <div class="nm">${K.icon(s)}<div><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a><small>${esc(s.title)}</small></div></div>
          <p class="ds">${esc(s.desc)}${st.role === 'ai' && s.aiMeta ? `<em>${esc(s.aiMeta.badge)}</em>` : ''}</p>
          ${FABS.map(f => `<span class="cell${K.has(s, f) ? '' : ' off'}${st.fab === f ? ' sel' : ''}" style="--c:var(--${f.toLowerCase()})" role="img" aria-label="${f} ${K.has(s, f) ? '適用' : '不適用'}"><i></i></span>`).join('')}
          <div class="act">${doc ? `<a class="doc" href="${esc(doc.url)}" target="_blank" rel="noopener">手冊</a>` : ''}<a class="go" href="${esc(s.url)}" target="_blank" rel="noopener" aria-label="開啟 ${esc(s.name)}">開啟</a></div>
        </div>`;
      };

      K.mount(st => {
        $('roles').innerHTML = K.ROLES.map(r => `<button class="role${r.id === 'fav' ? ' fav' : ''}" data-role="${r.id}" data-k="r-${r.id}" aria-current="${st.role === r.id}"><span>${r.id === 'fav' ? '★ ' : ''}${esc(r.name)}</span><span class="n">${K.count(r.id)}</span></button>`).join('');
        $('found').innerHTML = `<b>${K.total()}</b>個系統`;
        document.querySelectorAll('#cols [data-fab]').forEach(b => b.setAttribute('aria-pressed', b.dataset.fab === st.fab));

        const r = K.role(st.role);
        const views = st.role === 'ai'
          ? `<div class="views">${[['scenario', '應用場景'], ['tech', '技術架構']].map(([id, t]) => `<button data-view="${id}" data-k="v-${id}" aria-pressed="${st.aiView === id}">${t}</button>`).join('')}</div>`
          : '';
        $('head').innerHTML = `<div class="head"><h1>${esc(r.name)}</h1><p>${esc(r.desc)}${st.q ? `　其他角色的符合數見${innerWidth > 1000 ? '左側' : '上方'}數字。` : ''}</p>${views}</div>`;

        const gs = K.groups();
        $('root').innerHTML = gs.length
          ? gs.map(g => `<section class="grp">
              ${g.flat ? '' : `<div class="grp-h"><h2>${esc(g.name)}</h2>${g.desc ? `<p>${esc(g.desc)}</p>` : ''}<span class="cnt">${g.systems.length}</span></div>`}
              ${g.systems.map(s => row(s, st)).join('')}
            </section>`).join('')
          : `<div class="empty">${K.emptyMsg()}</div>`;
      });
    })();
  </script>
</body>
</html>
