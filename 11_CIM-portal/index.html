<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>CIM Web Portal 2.0 | 智慧製造入口平台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Distinctive Web Fonts: Space Grotesk (Tech headings) & Outfit (Modern clean body) & JetBrains Mono (Codes) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ─── CSS Variables & Design System ─── */
    :root {
      /* Theme Palettes */
      --bg: #090c10;
      --bg-surface: #0f141c;
      --bg-card: rgba(18, 24, 34, 0.72);
      --bg-card-hover: rgba(26, 35, 50, 0.88);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(0, 242, 254, 0.55);
      --border-subtle: rgba(255, 255, 255, 0.04);

      /* Typography & Colors */
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --text-dim: #484f58;
      
      /* Vibrant Electric Brand Accents */
      --primary: #00f2fe;
      --primary-glow: rgba(0, 242, 254, 0.25);
      --secondary: #4facfe;
      --ai-purple: #a855f7;
      --ai-glow: rgba(168, 85, 247, 0.35);

      /* Fab Colors */
      --fab-array: #38bdf8;  /* Cyan Blue */
      --fab-cf: #34d399;     /* Emerald Green */
      --fab-lcd: #fb923c;    /* Solar Amber */
      --fab-plp: #c084fc;    /* Deep Purple */
      --fab-all: #94a3b8;    /* Slate */

      /* Metrics & Geometry */
      --header-h: 70px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-card: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --shadow-hover: 0 16px 40px -10px rgba(0, 242, 254, 0.18), 0 0 20px rgba(79, 172, 254, 0.12);
      
      --font-display: 'Space Grotesk', -apple-system, sans-serif;
      --font-body: 'Outfit', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #f3f6f9;
      --bg-surface: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-card-hover: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --border-focus: #0071e3;
      --border-subtle: rgba(0, 0, 0, 0.04);
      --text: #1d1d1f;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --primary: #0071e3;
      --primary-glow: rgba(0, 113, 227, 0.2);
      --secondary: #0284c7;
      --ai-purple: #7c3aed;
      --ai-glow: rgba(124, 58, 237, 0.2);
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.06);
      --shadow-hover: 0 12px 30px rgba(0, 113, 227, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 60%, rgba(168, 85, 247, 0.06) 0%, transparent 45%);
      background-attachment: fixed;
    }

    /* ─── Header & Global Toolbar ─── */
    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: var(--header-h);
      background: rgba(9, 12, 16, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="light"] .header {
      background: rgba(255, 255, 255, 0.88);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      text-decoration: none;
    }

    .brand-mark {
      position: relative;
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 20px;
      color: #000;
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .brand-mark::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: linear-gradient(135deg, var(--primary), var(--ai-purple));
      z-index: -1;
      opacity: 0.6;
      filter: blur(4px);
    }

    .brand-text h1 {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-text h1 span.badge-v2 {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 6px;
      background: linear-gradient(90deg, rgba(0,242,254,0.15), rgba(168,85,247,0.15));
      border: 1px solid rgba(0,242,254,0.3);
      color: var(--primary);
    }

    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    /* Header Middle: Global Omni Search */
    .search-container {
      position: relative;
      width: 440px;
      transition: width 0.3s ease;
    }

    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      height: 42px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 0 46px 0 42px;
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="light"] .search-input {
      background: rgba(0, 0, 0, 0.04);
    }

    .search-input:focus {
      background: var(--bg-surface);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .search-icon-left {
      position: absolute;
      left: 15px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
    }

    .search-key-badge {
      position: absolute;
      right: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Header Right Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .fab-pill-selector {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 24px;
      gap: 2px;
    }

    [data-theme="light"] .fab-pill-selector {
      background: rgba(0,0,0,0.04);
    }

    .fab-btn {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .fab-btn:hover {
      color: var(--text);
    }

    .fab-btn.active {
      background: var(--primary);
      color: #000;
      box-shadow: 0 2px 10px var(--primary-glow);
      font-weight: 700;
    }

    .fab-btn[data-fab="ARRAY"].active { background: var(--fab-array); color: #000; }
    .fab-btn[data-fab="CF"].active { background: var(--fab-cf); color: #000; }
    .fab-btn[data-fab="LCD"].active { background: var(--fab-lcd); color: #000; }
    .fab-btn[data-fab="PLP"].active { background: var(--fab-plp); color: #000; }

    .action-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .action-icon-btn:hover {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    .badge-count {
      position: absolute;
      top: -3px;
      right: -3px;
      background: #ff3b30;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 10px;
      line-height: 1;
    }

    /* ─── Hero Billboard / Quick Stats ─── */
    .hero-banner {
      padding: 24px 32px 10px;
      max-width: 1480px;
      margin: 0 auto;
    }

    .billboard-glass {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 28px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .billboard-glass::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.5), rgba(168, 85, 247, 0.5), transparent);
    }

    .greeting-area h2 {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .greeting-area p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .quick-stats-row {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .stat-node {
      text-align: right;
    }

    .stat-val {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    .stat-lbl {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    /* ─── Role Navigation Tabs (Workbenches) ─── */
    .nav-tabs-wrapper {
      max-width: 1480px;
      margin: 16px auto 0;
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav-tabs-wrapper::-webkit-scrollbar { display: none; }

    .role-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      position: relative;
    }

    .role-tab:hover {
      color: var(--text);
    }

    .role-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }

    .role-tab.ai-tab {
      color: var(--ai-purple);
    }

    .role-tab.ai-tab.active {
      color: var(--ai-purple);
      border-bottom-color: var(--ai-purple);
      text-shadow: 0 0 12px var(--ai-glow);
    }

    .role-tab-badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-muted);
    }

    .role-tab.active .role-tab-badge {
      background: var(--primary-glow);
      color: var(--primary);
    }

    /* ─── Main Content Container ─── */
    .main-container {
      max-width: 1480px;
      margin: 0 auto;
      padding: 24px 32px 64px;
    }

    /* ─── AI Flagship Specific Dual-View Switch ─── */
    .ai-view-switch-panel {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.08) 0%, rgba(0, 242, 254, 0.05) 100%);
      border: 1px solid rgba(168, 85, 247, 0.2);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .ai-view-title h3 {
      font-family: var(--font-display);
      font-size: 18px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    [data-theme="light"] .ai-view-title h3 { color: #1d1d1f; }

    .ai-view-title p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .view-segmented-ctrl {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 3px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    [data-theme="light"] .view-segmented-ctrl {
      background: rgba(0, 0, 0, 0.06);
    }

    .view-seg-btn {
      padding: 7px 18px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .view-seg-btn.active {
      background: var(--ai-purple);
      color: #fff;
      box-shadow: 0 2px 10px var(--ai-glow);
    }

    /* ─── Context Subgroups / Section Headers ─── */
    .context-section {
      margin-bottom: 36px;
    }

    .context-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .context-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .context-accent-bar {
      width: 4px;
      height: 18px;
      border-radius: 2px;
      background: var(--primary);
    }

    .context-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .context-counter {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* ─── System Cards Grid Layout ─── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 20px;
    }

    /* ─── Premium System Card UI ─── */
    .sys-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-card);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.25s ease;
      overflow: hidden;
    }

    .sys-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-focus);
      background: var(--bg-card-hover);
    }

    .sys-card.featured-ai {
      border-color: rgba(168, 85, 247, 0.3);
    }

    .sys-card.featured-ai:hover {
      border-color: var(--ai-purple);
      box-shadow: 0 16px 40px -10px rgba(168, 85, 247, 0.3);
    }

    /* Card Top Bar */
    .card-head {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }

    .card-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .sys-card:hover .card-icon-box {
      transform: scale(1.05);
    }

    .card-icon-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-avatar-letter {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      background: linear-gradient(135deg, #1e293b, #334155);
    }

    .card-titles {
      flex: 1;
      min-width: 0;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-decoration: none;
      transition: color 0.2s;
    }

    .card-name:hover {
      color: var(--primary);
    }

    .star-fav-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .star-fav-btn:hover {
      color: #f59e0b;
      transform: scale(1.15);
    }

    .star-fav-btn.favorited {
      color: #f59e0b;
    }

    .card-sub-code {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* Card Body */
    .card-body {
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ai-pill-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 8px;
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 6px;
      color: var(--ai-purple);
      margin-top: 10px;
    }

    /* Card Footer & Action Area */
    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }

    .fabs-tag-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .fab-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
    }

    .fab-tag[data-fab="ARRAY"] { color: var(--fab-array); background: rgba(56, 189, 248, 0.1); }
    .fab-tag[data-fab="CF"] { color: var(--fab-cf); background: rgba(52, 211, 153, 0.1); }
    .fab-tag[data-fab="LCD"] { color: var(--fab-lcd); background: rgba(251, 146, 60, 0.1); }
    .fab-tag[data-fab="PLP"] { color: var(--fab-plp); background: rgba(192, 132, 252, 0.1); }

    .card-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action-doc {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.18s;
    }

    .btn-action-doc:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    .btn-action-launch {
      font-size: 12px;
      font-weight: 600;
      color: #000;
      background: var(--primary);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn-action-launch:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    /* ─── Drawer Modal: Favorite Quick Drawer ─── */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 420px;
      max-width: 90vw;
      background: var(--bg-surface);
      border-left: 1px solid var(--border);
      z-index: 2001;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 40px rgba(0,0,0,0.5);
    }

    .drawer-overlay.open .drawer-panel {
      transform: translateX(0);
    }

    .drawer-head {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-head h3 {
      font-family: var(--font-display);
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ─── Empty & No-result States ─── */
    .no-results-box {
      text-align: center;
      padding: 64px 20px;
      color: var(--text-muted);
    }

    .no-results-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    /* ─── Responsive Adjustments ─── */
    @media (max-width: 1024px) {
      .search-container { width: 300px; }
      .quick-stats-row { display: none; }
      .header { padding: 0 16px; }
      .main-container { padding: 20px 16px 48px; }
      .hero-banner { padding: 16px 16px 4px; }
      .nav-tabs-wrapper { padding: 0 16px; }
    }

    @media (max-width: 768px) {
      .header { height: auto; padding: 12px 16px; flex-wrap: wrap; gap: 12px; }
      .search-container { width: 100%; order: 3; }
      .fab-pill-selector { display: none; }
    }
  </style>
</head>
<body>

  <!-- Global Header Bar -->
  <header class="header">
    <a href="#" class="brand-group" onclick="switchRoleTab('all'); return false;">
      <div class="brand-mark">C</div>
      <div class="brand-text">
        <h1>CIM Web Portal <span class="badge-v2">2.0</span></h1>
        <p>ARRAY / CF / LCD / PLP 智慧製造工作台</p>
      </div>
    </a>

    <!-- Global Omni Search -->
    <div class="search-container">
      <div class="search-input-wrap">
        <span class="search-icon-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input type="text" id="global-search" class="search-input" placeholder="全域秒搜系統名稱、縮寫或關鍵字..." autocomplete="off">
        <span class="search-key-badge">/</span>
      </div>
    </div>

    <!-- Header Actions (Fab Switcher + Favorites Drawer + Theme) -->
    <div class="header-actions">
      <div class="fab-pill-selector" id="fab-switcher">
        <button class="fab-btn active" data-fab="ALL">全部</button>
        <button class="fab-btn" data-fab="ARRAY">ARRAY</button>
        <button class="fab-btn" data-fab="CF">CF</button>
        <button class="fab-btn" data-fab="LCD">LCD</button>
        <button class="fab-btn" data-fab="PLP">PLP</button>
      </div>

      <!-- Favorites Drawer Trigger -->
      <button class="action-icon-btn" id="fav-drawer-toggle" title="我的常用收藏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span class="badge-count" id="fav-count-badge" style="display:none;">0</span>
      </button>

      <!-- Theme Switcher -->
      <button class="action-icon-btn" id="theme-toggle" title="切換深色/淺色主題">
        <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <!-- Moon icon -->
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Hero Billboard & Status Overview -->
  <div class="hero-banner">
    <div class="billboard-glass">
      <div class="greeting-area">
        <h2 id="role-headline">🏭 CIM 智慧製造整合入口</h2>
        <p id="role-subtitle">聚焦角色工作流，整合即時數據、缺陷判讀、動態派工與 AI 核心平台</p>
      </div>
      <div class="quick-stats-row">
        <div class="stat-node">
          <div class="stat-val" id="stat-total-sys">20</div>
          <div class="stat-lbl">線上收錄系統</div>
        </div>
        <div class="stat-node">
          <div class="stat-val" id="stat-ai-sys" style="color: var(--ai-purple)">4</div>
          <div class="stat-lbl">AI 智慧工具</div>
        </div>
        <div class="stat-node">
          <div class="stat-val" id="stat-active-fab" style="color: var(--fab-array)">ALL</div>
          <div class="stat-lbl">當前廠別</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Role Navigation Tabs (Workbenches) -->
  <nav class="nav-tabs-wrapper" id="role-tabs-bar">
    <!-- Injected dynamically via JavaScript -->
  </nav>

  <!-- Main View Area -->
  <main class="main-container">
    <!-- AI Hub Dedicated Dual-View Switch (Only visible in AI tab) -->
    <div class="ai-view-switch-panel" id="ai-view-panel" style="display: none;">
      <div class="ai-view-title">
        <h3>🤖 AI 智慧製造專區</h3>
        <p>以 AI 驅動之產線瑕疵判定、精密量測補償、製程特徵預測與企業級 MLOps 服務</p>
      </div>
      <div class="view-segmented-ctrl">
        <button class="view-seg-btn active" id="ai-view-scenario-btn" onclick="switchAiView('scenario')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          應用落地場景
        </button>
        <button class="view-seg-btn" id="ai-view-tech-btn" onclick="switchAiView('tech')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
          技術架構體系
        </button>
      </div>
    </div>

    <!-- Dynamic Systems Grid Target -->
    <div id="portal-content-root">
      <!-- Populated via renderCurrentView() -->
    </div>
  </main>

  <!-- Slide-over Drawer for Favorites (我的常用) -->
  <div class="drawer-overlay" id="fav-drawer">
    <div class="drawer-panel">
      <div class="drawer-head">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          我的常用收藏 (<span id="drawer-fav-count">0</span>)
        </h3>
        <button class="drawer-close-btn" id="fav-drawer-close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="drawer-body" id="fav-drawer-list">
        <!-- Rendered favorite cards -->
      </div>
    </div>
  </div>

  <!-- Load Portal Configuration Data -->
  <script src="portal-data.js"></script>

  <!-- Portal 2.0 State Machine & Renderer -->
  <script>
    (function() {
      // Local State
      const state = {
        currentRole: 'ai', // default to flagship AI Hub as per specification
        currentFab: 'ALL',
        aiViewMode: 'scenario', // 'scenario' | 'tech'
        searchQuery: '',
        favorites: JSON.parse(localStorage.getItem('CIM_PORTAL_FAVORITES') || '[]'),
        theme: localStorage.getItem('CIM_PORTAL_THEME') || 'dark'
      };

      // Set initial theme
      document.documentElement.setAttribute('data-theme', state.theme);

      // DOM Elements
      const elements = {
        roleTabsBar: document.getElementById('role-tabs-bar'),
        contentRoot: document.getElementById('portal-content-root'),
        aiViewPanel: document.getElementById('ai-view-panel'),
        searchQueryInput: document.getElementById('global-search'),
        favDrawer: document.getElementById('fav-drawer'),
        favDrawerList: document.getElementById('fav-drawer-list'),
        favCountBadge: document.getElementById('fav-count-badge'),
        drawerFavCount: document.getElementById('drawer-fav-count'),
        statTotalSys: document.getElementById('stat-total-sys'),
        statAiSys: document.getElementById('stat-ai-sys'),
        statActiveFab: document.getElementById('stat-active-fab'),
        roleHeadline: document.getElementById('role-headline'),
        roleSubtitle: document.getElementById('role-subtitle')
      };

      // --- Initialization ---
      function init() {
        renderTabs();
        updateFavoritesBadge();
        bindEvents();
        renderCurrentView();
        updateGlobalStats();
      }

      // --- Bind Global Events ---
      function bindEvents() {
        // Fab Switcher
        document.querySelectorAll('#fab-switcher .fab-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('#fab-switcher .fab-btn').forEach(b => b.classList.remove('active'));
            e.currentTarget.classList.add('active');
            state.currentFab = e.currentTarget.dataset.fab;
            state.searchQuery = ''; // Clear search filter on fab switch
            elements.searchQueryInput.value = '';
            updateGlobalStats();
            renderCurrentView();
          });
        });

        // Search Input
        elements.searchQueryInput.addEventListener('input', (e) => {
          state.searchQuery = e.target.value.trim().toLowerCase();
          renderCurrentView();
        });

        // Shortcut '/' to focus search
        window.addEventListener('keydown', (e) => {
          if (e.key === '/' && document.activeElement !== elements.searchQueryInput) {
            e.preventDefault();
            elements.searchQueryInput.focus();
            elements.searchQueryInput.select();
          }
        });

        // Favorites Drawer Toggle
        document.getElementById('fav-drawer-toggle').addEventListener('click', openFavDrawer);
        document.getElementById('fav-drawer-close').addEventListener('click', closeFavDrawer);
        elements.favDrawer.addEventListener('click', (e) => {
          if (e.target === elements.favDrawer) closeFavDrawer();
        });

        // Theme Toggle
        document.getElementById('theme-toggle').addEventListener('click', () => {
          state.theme = state.theme === 'dark' ? 'light' : 'dark';
          localStorage.setItem('CIM_PORTAL_THEME', state.theme);
          document.documentElement.setAttribute('data-theme', state.theme);
          updateThemeIcon();
        });
      }

      function updateThemeIcon() {
        const iconSvg = document.getElementById('theme-icon');
        if (state.theme === 'light') {
          // Sun Icon
          iconSvg.innerHTML = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
        } else {
          // Moon Icon
          iconSvg.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
        }
      }

      // --- Role Navigation Tabs Rendering ---
      function renderTabs() {
        const config = window.CIM_PORTAL_CONFIG;
        elements.roleTabsBar.innerHTML = config.roles.map(role => {
          const isAi = role.id === 'ai';
          const isActive = role.id === state.currentRole;
          const count = getSystemsForRole(role.id).length;
          return `
            <button class="role-tab ${isAi ? 'ai-tab' : ''} ${isActive ? 'active' : ''}" 
                    onclick="window.switchRoleTab('${role.id}')"
                    data-role="${role.id}">
              <span>${role.name}</span>
              <span class="role-tab-badge">${count}</span>
            </button>
          `;
        }).join('');
      }

      // Global switch tab hook
      window.switchRoleTab = function(roleId) {
        state.currentRole = roleId;
        renderTabs();
        renderCurrentView();
        updateHeadline();
      };

      window.switchAiView = function(viewMode) {
        state.aiViewMode = viewMode;
        document.getElementById('ai-view-scenario-btn').classList.toggle('active', viewMode === 'scenario');
        document.getElementById('ai-view-tech-btn').classList.toggle('active', viewMode === 'tech');
        renderCurrentView();
      };

      function updateHeadline() {
        const config = window.CIM_PORTAL_CONFIG;
        const current = config.roles.find(r => r.id === state.currentRole);
        if (current) {
          elements.roleHeadline.innerText = `${current.name}工作台`;
          elements.roleSubtitle.innerText = current.desc;
        }
      }

      // --- Filter Functions ---
      function getSystemsForRole(roleId) {
        const all = window.CIM_PORTAL_CONFIG.systems;
        if (roleId === 'all') return all;
        return all.filter(s => s.roles.includes(roleId));
      }

      function filterByFabAndSearch(systems) {
        return systems.filter(sys => {
          // Fab filtering
          const matchFab = (state.currentFab === 'ALL') || 
                           (sys.fabs.includes('ALL')) || 
                           (sys.fabs.includes(state.currentFab));
          
          if (!matchFab) return false;

          // Search filtering
          if (!state.searchQuery) return true;
          const q = state.searchQuery;
          const matchName = sys.name.toLowerCase().includes(q);
          const matchTitle = (sys.title || '').toLowerCase().includes(q);
          const matchCode = (sys.code || '').toLowerCase().includes(q);
          const matchDesc = (sys.desc || '').toLowerCase().includes(q);
          return matchName || matchTitle || matchCode || matchDesc;
        });
      }

      // --- Main View Renderer ---
      function renderCurrentView() {
        const config = window.CIM_PORTAL_CONFIG;
        const isAiTab = state.currentRole === 'ai';
        elements.aiViewPanel.style.display = isAiTab && !state.searchQuery ? 'flex' : 'none';

        let html = '';

        // If in global search mode
        if (state.searchQuery) {
          const results = filterByFabAndSearch(config.systems);
          html = `
            <div class="context-section">
              <div class="context-header">
                <div class="context-title-wrap">
                  <div class="context-accent-bar" style="background:var(--primary)"></div>
                  <h3 class="context-title">搜尋結果: "${escapeHtml(state.searchQuery)}"</h3>
                </div>
                <span class="context-counter">${results.length} 個系統符合</span>
              </div>
              ${results.length ? renderCardsGrid(results) : renderEmpty('無符合的系統，請嘗試更換關鍵字或切換廠別')}
            </div>
          `;
          elements.contentRoot.innerHTML = html;
          return;
        }

        // View 1: AI Dedicated Flagship View
        if (isAiTab) {
          const aiSystems = filterByFabAndSearch(getSystemsForRole('ai'));
          const groupDefs = state.aiViewMode === 'scenario' 
            ? config.aiViews.scenarios 
            : config.aiViews.technologies;

          html = groupDefs.map(group => {
            const matchedSys = aiSystems.filter(s => {
              if (!s.aiMeta) return false;
              return state.aiViewMode === 'scenario' 
                ? s.aiMeta.scenario === group.id 
                : s.aiMeta.tech === group.id;
            });

            if (matchedSys.length === 0) return '';

            return `
              <div class="context-section">
                <div class="context-header">
                  <div class="context-title-wrap">
                    <div class="context-accent-bar" style="background:var(--ai-purple)"></div>
                    <div>
                      <h3 class="context-title">${group.name}</h3>
                      <p style="font-size:12px; color:var(--text-muted); margin-top:2px;">${group.desc}</p>
                    </div>
                  </div>
                  <span class="context-counter">${matchedSys.length} 項系統</span>
                </div>
                ${renderCardsGrid(matchedSys)}
              </div>
            `;
          }).join('');

          if (!html.trim()) {
            html = renderEmpty('此廠別條件下尚無 AI 系統');
          }
          elements.contentRoot.innerHTML = html;
          return;
        }

        // View 2: Sub-Context Grouped Views (MFG / ENG / INT / QA / CIM)
        if (config.contextGroups[state.currentRole]) {
          const roleSys = filterByFabAndSearch(getSystemsForRole(state.currentRole));
          const subGroups = config.contextGroups[state.currentRole];

          html = subGroups.map(group => {
            const groupSys = roleSys.filter(s => {
              return s.contexts && s.contexts[state.currentRole] === group.id;
            });

            if (groupSys.length === 0) return '';

            return `
              <div class="context-section">
                <div class="context-header">
                  <div class="context-title-wrap">
                    <div class="context-accent-bar"></div>
                    <h3 class="context-title">${group.name}</h3>
                  </div>
                  <span class="context-counter">${groupSys.length} 項系統</span>
                </div>
                ${renderCardsGrid(groupSys)}
              </div>
            `;
          }).join('');

          if (!html.trim()) {
            html = renderEmpty('此廠別篩選下無該角色的系統');
          }
          elements.contentRoot.innerHTML = html;
          return;
        }

        // View 3: Flat View (ALL Systems)
        const allFiltered = filterByFabAndSearch(config.systems);
        html = `
          <div class="context-section">
            <div class="context-header">
              <div class="context-title-wrap">
                <div class="context-accent-bar" style="background:var(--fab-all)"></div>
                <h3 class="context-title">全廠系統清單一覽</h3>
              </div>
              <span class="context-counter">${allFiltered.length} 個系統</span>
            </div>
            ${allFiltered.length ? renderCardsGrid(allFiltered) : renderEmpty('無系統資料')}
          </div>
        `;
        elements.contentRoot.innerHTML = html;
      }

      // --- System Card Generator ---
      function renderCardsGrid(systems) {
        return `
          <div class="cards-grid">
            ${systems.map(s => renderSystemCard(s)).join('')}
          </div>
        `;
      }

      function renderSystemCard(sys) {
        const isFav = state.favorites.includes(sys.id);
        const isAi = sys.roles.includes('ai');
        const letter = (sys.name || '?').trim().charAt(0).toUpperCase();

        const iconHtml = sys.icon 
          ? `<img src="${sys.icon}" alt="${sys.name}" onerror="this.parentNode.outerHTML='<div class=card-avatar-letter>${letter}</div>'">`
          : `<div class="card-avatar-letter">${letter}</div>`;

        const fabBadgesHtml = sys.fabs.map(f => `<span class="fab-tag" data-fab="${f}">${f}</span>`).join('');

        const docBtn = sys.docs && sys.docs.length > 0
          ? `<a href="${sys.docs[0].url}" target="_blank" class="btn-action-doc" title="${sys.docs[0].title}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
              手冊
             </a>`
          : '';

        const aiTagHtml = sys.aiMeta 
          ? `<div class="ai-pill-tag">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              ${sys.aiMeta.badge || 'AI 智造賦能'}
             </div>`
          : '';

        return `
          <div class="sys-card ${isAi ? 'featured-ai' : ''}" data-id="${sys.id}">
            <div class="card-head">
              <div class="card-icon-box">
                ${iconHtml}
              </div>
              <div class="card-titles">
                <div class="card-title-row">
                  <a href="${sys.url}" target="_blank" class="card-name" title="${sys.title || sys.name}">${sys.name}</a>
                  <button class="star-fav-btn ${isFav ? 'favorited' : ''}" onclick="window.toggleFavorite('${sys.id}')" title="加入/取消收藏">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                  </button>
                </div>
                <div class="card-sub-code">${sys.title || sys.code}</div>
              </div>
            </div>

            <div class="card-body">
              <p class="card-desc">${sys.desc}</p>
              ${aiTagHtml}
            </div>

            <div class="card-foot">
              <div class="fabs-tag-group">
                ${fabBadgesHtml}
              </div>
              <div class="card-btn-group">
                ${docBtn}
                <a href="${sys.url}" target="_blank" class="btn-action-launch">
                  進入
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                </a>
              </div>
            </div>
          </div>
        `;
      }

      function renderEmpty(msg) {
        return `
          <div class="no-results-box">
            <div class="no-results-icon">🔍</div>
            <p>${msg}</p>
          </div>
        `;
      }

      // --- Favorites Drawer Management ---
      window.toggleFavorite = function(sysId) {
        const idx = state.favorites.indexOf(sysId);
        if (idx > -1) {
          state.favorites.splice(idx, 1);
        } else {
          state.favorites.push(sysId);
        }
        localStorage.setItem('CIM_PORTAL_FAVORITES', JSON.stringify(state.favorites));
        updateFavoritesBadge();
        renderCurrentView();
        renderFavDrawerList();
      };

      function updateFavoritesBadge() {
        const count = state.favorites.length;
        elements.favCountBadge.innerText = count;
        elements.favCountBadge.style.display = count > 0 ? 'block' : 'none';
        elements.drawerFavCount.innerText = count;
      }

      function openFavDrawer() {
        renderFavDrawerList();
        elements.favDrawer.classList.add('open');
      }

      function closeFavDrawer() {
        elements.favDrawer.classList.remove('open');
      }

      function renderFavDrawerList() {
        const config = window.CIM_PORTAL_CONFIG;
        const favSystems = config.systems.filter(s => state.favorites.includes(s.id));
        if (favSystems.length === 0) {
          elements.favDrawerList.innerHTML = `
            <div class="no-results-box">
              <div class="no-results-icon">⭐</div>
              <p>尚未加入任何常用系統<br><small style="color:var(--text-dim)">點擊卡片右上角星星即可釘選</small></p>
            </div>
          `;
          return;
        }

        elements.favDrawerList.innerHTML = favSystems.map(sys => {
          return `
            <div class="sys-card" style="padding:14px;">
              <div class="card-head" style="margin-bottom:8px;">
                <div class="card-titles">
                  <div class="card-title-row">
                    <a href="${sys.url}" target="_blank" class="card-name">${sys.name}</a>
                    <button class="star-fav-btn favorited" onclick="window.toggleFavorite('${sys.id}')">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    </button>
                  </div>
                  <div class="card-sub-code">${sys.title || sys.code}</div>
                </div>
              </div>
              <div class="card-foot" style="padding-top:8px;">
                <span style="font-size:11px; color:var(--text-muted);">${sys.fabs.join(', ')}</span>
                <a href="${sys.url}" target="_blank" class="btn-action-launch">開啟 ↗</a>
              </div>
            </div>
          `;
        }).join('');
      }

      function updateGlobalStats() {
        const config = window.CIM_PORTAL_CONFIG;
        elements.statTotalSys.innerText = config.systems.length;
        elements.statAiSys.innerText = config.systems.filter(s => s.roles.includes('ai')).length;
        elements.statActiveFab.innerText = state.currentFab;
      }

      function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      // Start application
      init();
    })();
  </script>
</body>
</html>
